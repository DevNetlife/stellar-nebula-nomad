# Monitoring stack for stellar-nebula-nomad
# Usage: docker compose -f monitoring/docker-compose.yml up -d

version: '3.8'

volumes:
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}

networks:
  monitoring:
    driver: bridge

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: nebula-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - '9090:9090'
    depends_on:
      - contract-exporter
      - alertmanager
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: nebula-alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - '9093:9093'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.2
    container_name: nebula-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: nebula-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - '9100:9100'
    networks:
      - monitoring

  contract-exporter:
    image: python:3.12-slim
    container_name: nebula-contract-exporter
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./exporters:/app:ro
    environment:
      - HORIZON_URL=${HORIZON_URL:-https://horizon-testnet.stellar.org}
      - CONTRACT_ID=${CONTRACT_ID:-}
      - EXPORTER_PORT=9200
    command: python -u contract_exporter.py
    ports:
      - '9200:9200'
    networks:
      - monitoring

  # Log aggregation (issue #516) — Loki stores logs, Promtail ships
  # container logs from the Docker daemon on this host into it. Grafana's
  # "Loki" datasource is provisioned in ./grafana/provisioning/datasources.
  loki:
    image: grafana/loki:2.9.6
    container_name: nebula-loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    ports:
      - '3100:3100'
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:2.9.6
    container_name: nebula-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    networks:
      - monitoring