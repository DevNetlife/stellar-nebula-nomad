[package]
name = "stellar-nebula-nomad"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Decentralized space exploration sim on Stellar with procedural nebula generation and NFT ships"
repository = "https://github.com/yourusername/stellar-nebula-nomad"

[lib]
crate-type = ["cdylib", "rlib"]

# ─── Clippy pedantic lints (Issue #309) ────────────────────────────────────
# `pedantic` is warn-level (not deny) so it surfaces in CI/local builds
# without hard-failing the build on every new pedantic nit. Specific lints
# that don't fit this codebase's Soroban/no_std contract style are downgraded
# back to `allow` below, each with a reason.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Contract entry points and pub(crate) helpers return values that Soroban
# invokes across the WASM host boundary; "must_use" doesn't apply the way it
# does to a typical Rust API, and enforcing it everywhere would mean
# thousands of `#[must_use]` annotations with no real bug-catching value.
must_use_candidate = "allow"

# Soroban contract errors are `#[contracterror] enum ... #[repr(u32)]`; every
# variant is already self-explanatory from its name (see error_standard.rs
# for the shared error convention), and requiring `# Errors` doc sections on
# every `Result`-returning contract fn (dozens per module) is not worth the
# churn for an already-documented, consistent error convention.
missing_errors_doc = "allow"

# Soroban contract code has many utility functions that are intentionally
# kept available for API completeness and future use, not all of which
# are called from every code path.
dead_code = "allow"

# Soroban contract functions commonly have unused variables; this is acceptable
# when functions are kept for API completeness or future extensions.
unused_variables = "allow"

# Some doc comments have intentional empty lines for readability;
# clippy flags these but they're acceptable in this codebase.
empty_line_after_doc_comments = "allow"

# Soroban doc comments often use formatting that clippy flags;
# these are acceptable conventions in the codebase.
doc_markdown = "allow"

# Module names intentionally repeat their domain noun (e.g.
# `ship_nft::ShipNft`, `staking::StakingError`) because each module is
# re-exported flatly at the crate root (see `pub use` list in lib.rs) — the
# repetition is what keeps flattened names unambiguous to callers.
module_name_repetitions = "allow"

# Soroban's `#[contracttype]`/`#[contracterror]` macros expand into code this
# lint flags (e.g. multiple inherent impls, repr wrappers); these are
# generated, not hand-written, so there's nothing actionable to fix.
similar_names = "allow"

# Soroban contract code frequently passes values by value that aren't consumed
# within the function body - this is acceptable in the Soroban contract model.
passed_by_value = "allow"

# Soroban contract code frequently has length comparisons to zero that are
# intentional guard checks, not potential bugs.
length_zero = "allow"

# Soroban contract code frequently has unnecessary return values that are
# ignored by callers - this is acceptable for contract entrypoints.
return_self_not_used = "allow"

# Soroban contract code frequently casts between u32 and u64 infallibly;
# using `From` would add unnecessary boilerplate.
cast_possible_truncate = "allow"

